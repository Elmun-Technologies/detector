name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the bundle exists
        run: test -f dist/index.html

  test:
    name: Tests (SQLite + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Unit and service tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-secret
        run: pytest backend/tests -m "not integration" -q
      - name: Alembic upgrade head (SQLite smoke)
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci-migrate.db
        run: PYTHONPATH=backend alembic upgrade head

  integration:
    name: Integration profile (PostgreSQL + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viral
          POSTGRES_USER: viral
          POSTGRES_PASSWORD: viral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U viral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://viral:viral@localhost:5432/viral
      INTEGRATION_DATABASE_URL: postgresql+psycopg://viral:viral@localhost:5432/viral
      REDIS_URL: redis://localhost:6379/1
      INTEGRATION_REDIS_URL: redis://localhost:6379/1
      INTEGRATION_S3_ENDPOINT: http://localhost:9000
      INTEGRATION_S3_BUCKET: viral-ci
      INTEGRATION_S3_ACCESS_KEY: minioadmin
      INTEGRATION_S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # MinIO needs a custom command, which GitHub service containers cannot express.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data --console-address ':9001'
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready"; exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Alembic upgrade head (PostgreSQL)
        run: PYTHONPATH=backend alembic upgrade head

      - name: Integration profile tests
        run: pytest backend/tests -m integration -q -rs

      - name: Full suite against PostgreSQL and Redis
        run: pytest backend/tests -m "not integration" -q

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
