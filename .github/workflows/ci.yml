name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Needed for ci/post_failure.py to comment the log tail on the PR when a step
# fails (the default token permissions are not guaranteed to include issues).
permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        run: ruff check backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify the bundle exists
        run: test -f dist/index.html

  test:
    name: Tests (SQLite + FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version | head -1
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Unit and service tests
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-secret
        run: pytest backend/tests -m "not integration" -q
      - name: Alembic upgrade head (SQLite smoke)
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci-migrate.db
        run: PYTHONPATH=backend alembic upgrade head

  integration:
    name: Integration profile (PostgreSQL + Redis + MinIO)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: viral
          POSTGRES_USER: viral
          POSTGRES_PASSWORD: viral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U viral"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://viral:viral@localhost:5432/viral
      INTEGRATION_DATABASE_URL: postgresql+psycopg://viral:viral@localhost:5432/viral
      REDIS_URL: redis://localhost:6379/1
      INTEGRATION_REDIS_URL: redis://localhost:6379/1
      INTEGRATION_S3_ENDPOINT: http://localhost:9000
      INTEGRATION_S3_BUCKET: viral-ci
      INTEGRATION_S3_ACCESS_KEY: minioadmin
      INTEGRATION_S3_SECRET_KEY: minioadmin
      JWT_SECRET: ci-secret
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      # MinIO needs a custom command, which GitHub service containers cannot express.
      # MinIO removed minio/minio and minio/mc from Docker Hub in September 2026,
      # so pull its quay.io registry first and fall back to a frozen community mirror.
      - name: Start MinIO
        run: |
          set -uo pipefail
          MINIO_IMAGE=""
          for candidate in \
            "quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z" \
            "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z" \
            "coollabsio/minio:RELEASE.2025-10-15T17-29-55Z"; do
            if docker pull "$candidate"; then
              MINIO_IMAGE="$candidate"
              break
            fi
            echo "pull failed for $candidate, trying next candidate"
          done
          if [ -z "$MINIO_IMAGE" ]; then
            echo "no pullable MinIO image found in any registry"
            docker version 2>&1 | head -20 || true
            exit 1
          fi
          docker rm -f minio >/dev/null 2>&1 || true
          docker run -d --name minio -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            "$MINIO_IMAGE" server /data --console-address ":9001" \
            || { echo "docker run failed for $MINIO_IMAGE"; docker ps -a; docker logs --tail 40 minio 2>/dev/null || true; exit 1; }
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is ready ($MINIO_IMAGE)"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become ready ($MINIO_IMAGE)"
          docker ps -a
          docker logs --tail 80 minio || true
          exit 1

      - name: Alembic upgrade head (PostgreSQL)
        run: PYTHONPATH=backend alembic upgrade head

      - name: Integration profile tests
        run: |
          # The default shell is 'bash -eo pipefail': without 'set +e' the
          # step dies on the pytest line before the diagnostics can run.
          set +e
          pytest backend/tests -m integration -q -rs 2>&1 | tee integration-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error::integration profile tests failed; log tail published to arena/ci-diagnostics"
            # Reliable channel: commit the log tail to a diagnostics branch.
            # Skipped when the workflow itself runs on that branch, so the
            # re-triggered run cannot push again (no infinite loop).
            if [ "${GITHUB_REF_NAME:-}" != "arena/ci-diagnostics" ]; then
              {
                echo "# CI integration failure"
                echo "run: ${GITHUB_RUN_ID} (${GITHUB_SHA})"
                echo "date: $(date -u +%FT%TZ)"
                echo "pytest exit status: ${status}"
                echo '---------------- log tail ----------------'
                tail -c 12000 integration-tests.log
              } > ci-failure.log
              git config user.name "ci-diagnostics"
              git config user.email "ci-diagnostics@users.noreply.github.com"
              git checkout -B arena/ci-diagnostics >/dev/null
              git add ci-failure.log
              if ! git diff --cached --quiet; then
                git commit -m "ci: integration failure log for ${GITHUB_SHA:0:7}" >/dev/null
                git push -f origin HEAD:arena/ci-diagnostics >/dev/null 2>&1 || true
              fi
            fi
            PR="${{ github.event.pull_request.number }}"
            [ -n "$PR" ] || PR=$(gh pr view --json number --jq '.number' 2>/dev/null || echo '')
            python3 ci/post_failure.py "$PR" integration-tests.log
            exit "$status"
          fi

      - name: Full suite against PostgreSQL and Redis
        run: |
          set +e
          pytest backend/tests -m "not integration" -q 2>&1 | tee full-suite.log
          status=${PIPESTATUS[0]}
          if [ "$status" != "0" ]; then
            echo "::error::full suite failed; log tail published to arena/ci-diagnostics-full"
            if [ "${GITHUB_REF_NAME:-}" != "arena/ci-diagnostics-full" ]; then
              {
                echo "# CI full-suite failure"
                echo "run: ${GITHUB_RUN_ID} (${GITHUB_SHA})"
                echo "date: $(date -u +%FT%TZ)"
                echo "pytest exit status: ${status}"
                echo '---------------- log tail ----------------'
                tail -c 12000 full-suite.log
              } > full-suite-failure.log
              git config user.name "ci-diagnostics"
              git config user.email "ci-diagnostics@users.noreply.github.com"
              git checkout -B arena/ci-diagnostics-full >/dev/null
              git add full-suite-failure.log
              if ! git diff --cached --quiet; then
                git commit -m "ci: full-suite failure log for ${GITHUB_SHA:0:7}" >/dev/null
                git push -f origin HEAD:arena/ci-diagnostics-full >/dev/null 2>&1 || true
              fi
            fi
            PR="${{ github.event.pull_request.number }}"
            [ -n "$PR" ] || PR=$(gh pr view --json number --jq '.number' 2>/dev/null || echo '')
            python3 ci/post_failure.py "$PR" full-suite.log
            exit "$status"
          fi

      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true
